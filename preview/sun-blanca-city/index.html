<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sun Blanca City</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --gold: #e4b15a;
        --gold-soft: #f3e2bc;
        --ink: #070604;
        --light: #fff6e8;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        overscroll-behavior: none;
      }
      .stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--ink);
        color: var(--light);
        font-family: Outfit, system-ui, sans-serif;
      }
      .sky,
      .sun,
      .stars,
      .vignette,
      .dune,
      .settlement,
      .dust {
        position: absolute;
        pointer-events: none;
      }
      .sky {
        inset: -8%;
        background: url("./sky.png") center / cover no-repeat;
        animation: drift 96s ease-in-out infinite alternate;
      }
      .sun {
        left: 50%;
        bottom: -34vh;
        width: min(108vh, 980px);
        aspect-ratio: 1;
        background: url("./sun.png") center / contain no-repeat;
        mix-blend-mode: screen;
        transform: translateX(-50%);
        opacity: 1;
        transition: opacity 900ms ease;
        animation: spin 180s linear infinite;
        -webkit-mask-image: radial-gradient(circle, #000 0%, #000 22%, transparent 56%);
        mask-image: radial-gradient(circle, #000 0%, #000 22%, transparent 56%);
      }
      .stars {
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      .vignette {
        inset: 0;
        z-index: 1;
        background:
          radial-gradient(ellipse at 50% 34%, transparent 0 18%, rgba(0, 0, 0, 0.28) 58%, rgba(0, 0, 0, 0.72) 100%),
          linear-gradient(180deg, rgba(0, 0, 0, 0.42), transparent 24% 58%, rgba(7, 6, 4, 0.2) 78%, #070604 100%);
      }
      .dune {
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2;
        width: 100%;
        height: 26vh;
      }
      .settlement {
        z-index: 2;
        left: 10vw;
        right: 10vw;
        bottom: 13vh;
        height: 90px;
      }
      .settlement i {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--light);
        box-shadow: 0 0 8px 2px rgba(228, 177, 90, 0.9);
        animation: twinkle 11s ease-in-out infinite;
      }
      .dust i {
        position: absolute;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: rgba(243, 226, 188, 0.7);
        animation: rise 70s linear infinite;
      }
      .dust { inset: 0; z-index: 2; }
      .stage.has-result .sun { opacity: 0.34; }
      .content {
        position: absolute;
        z-index: 3;
        left: 0;
        right: 0;
        top: 11vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0 24px;
        pointer-events: none;
      }
      .stage.has-result .content { top: 3.2vh; }
      .kicker {
        margin: 0 0 14px;
        color: var(--gold);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.46em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(58px, 9vw, 120px);
        font-weight: 500;
        line-height: 0.86;
        letter-spacing: -0.03em;
        transition: font-size 560ms ease;
      }
      .stage.has-result h1 { font-size: clamp(34px, 5vw, 64px); }
      .stage.has-result .kicker { margin-bottom: 8px; }
      h1 span {
        display: block;
      }
      h1 em {
        display: block;
        margin-top: 4px;
        color: var(--gold-soft);
        font-style: italic;
        font-weight: 500;
        text-shadow: 0 0 36px rgba(228, 177, 90, 0.45);
      }
      .deck {
        max-width: 34rem;
        margin: 22px 0 0;
        max-height: 5rem;
        overflow: hidden;
        color: rgba(255, 246, 232, 0.78);
        font-size: clamp(15px, 2vw, 18px);
        font-weight: 300;
        letter-spacing: 0.04em;
        transition: opacity 420ms ease, max-height 520ms ease, margin-top 520ms ease;
      }
      .stage.has-result .deck {
        max-height: 0;
        margin-top: 0;
        opacity: 0;
      }
      .cta {
        position: relative;
        margin-top: 32px;
        pointer-events: auto;
      }
      button {
        position: relative;
        border: 1px solid rgba(228, 177, 90, 0.85);
        border-radius: 999px;
        background: rgba(7, 6, 4, 0.45);
        color: var(--gold-soft);
        padding: 15px 36px;
        font: 500 14px/1 Outfit, system-ui, sans-serif;
        letter-spacing: 0.22em;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: background 240ms ease, color 240ms ease, border-color 240ms ease;
      }
      button:hover,
      button[aria-expanded="true"] {
        background: var(--gold);
        border-color: var(--gold);
        color: #1a1208;
      }
      button:focus-visible {
        outline: 2px solid var(--light);
        outline-offset: 4px;
      }
      .portrait {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 6px;
      }
      .portrait[hidden] { display: none; }
      .portrait.is-in { animation: portrait-in 1s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .aura {
        position: absolute;
        z-index: 0;
        left: 50%;
        top: 8%;
        width: 140%;
        height: 72%;
        transform: translateX(-50%);
        background: radial-gradient(ellipse at center, rgba(228, 177, 90, 0.42), transparent 68%);
        filter: blur(10px);
        animation: aura 4.8s ease-in-out infinite alternate;
      }
      .frame {
        position: relative;
        z-index: 1;
        width: min(78vw, 380px);
        height: auto;
        aspect-ratio: 1024 / 1280;
        padding: 8px;
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(243, 226, 188, 0.24), rgba(228, 177, 90, 0.06));
        box-shadow:
          0 0 0 1px rgba(228, 177, 90, 0.75),
          0 28px 70px rgba(0, 0, 0, 0.55),
          0 0 54px rgba(228, 177, 90, 0.28);
        overflow: hidden;
      }
      .frame.is-ready { animation: float 7s ease-in-out 1.05s infinite alternate; }
      .frame a {
        display: block;
        height: 100%;
        cursor: pointer;
        pointer-events: auto;
      }
      .frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        border-radius: 15px;
        background: #120e09;
        opacity: 0;
        transform: scale(1.045);
        transition: opacity 720ms ease, transform 1100ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      .frame.is-ready img { opacity: 1; transform: none; }
      .frame.is-loading::before {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 15px;
        background: linear-gradient(
          110deg,
          rgba(255, 246, 232, 0.04) 28%,
          rgba(228, 177, 90, 0.24) 48%,
          rgba(255, 246, 232, 0.04) 66%
        );
        background-size: 220% 100%;
        animation: shimmer 1.35s ease-in-out infinite;
      }
      .sheen {
        position: absolute;
        inset: 8px;
        border-radius: 15px;
        overflow: hidden;
        pointer-events: none;
      }
      .frame.is-ready .sheen::after {
        content: "";
        position: absolute;
        top: -20%;
        bottom: -20%;
        left: 0;
        width: 34%;
        background: linear-gradient(90deg, transparent, rgba(255, 246, 232, 0.48), transparent);
        transform: translateX(-180%) skewX(-16deg);
        animation: sheen 1.15s ease 0.18s 1 both;
      }
      .corner {
        position: absolute;
        width: 14px;
        height: 14px;
        border: 1.5px solid var(--gold-soft);
        pointer-events: none;
      }
      .corner.tl { top: 14px; left: 14px; border-right: 0; border-bottom: 0; }
      .corner.tr { top: 14px; right: 14px; border-left: 0; border-bottom: 0; }
      .corner.bl { bottom: 14px; left: 14px; border-right: 0; border-top: 0; }
      .corner.br { bottom: 14px; right: 14px; border-left: 0; border-top: 0; }
      .portrait figcaption {
        margin: 14px 0 0;
        color: var(--gold);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.42em;
        text-transform: uppercase;
      }
      .stage.has-result .cta { margin-top: 18px; }
      @keyframes drift {
        from { transform: scale(1.06) translate3d(-1.2%, -0.6%, 0); }
        to { transform: scale(1.12) translate3d(1.4%, 1%, 0); }
      }
      @keyframes spin {
        from { transform: translateX(-50%) rotate(0deg); }
        to { transform: translateX(-50%) rotate(360deg); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 1; }
      }
      @keyframes rise {
        from { transform: translate3d(0, 12vh, 0); opacity: 0; }
        12% { opacity: 0.8; }
        to { transform: translate3d(18px, -70vh, 0); opacity: 0; }
      }
      @keyframes portrait-in {
        from { opacity: 0; transform: translateY(26px) scale(0.94); filter: blur(8px); }
        to { opacity: 1; transform: none; filter: none; }
      }
      @keyframes float {
        from { transform: translateY(0); }
        to { transform: translateY(-7px); }
      }
      @keyframes sheen {
        from { transform: translateX(-180%) skewX(-16deg); }
        to { transform: translateX(420%) skewX(-16deg); }
      }
      @keyframes shimmer {
        from { background-position: 120% 0; }
        to { background-position: -120% 0; }
      }
      @keyframes aura {
        from { opacity: 0.55; }
        to { opacity: 1; }
      }
      @media (max-height: 740px) {
        .content { top: 6vh; }
        h1 { font-size: clamp(48px, 8vw, 84px); }
        .stage.has-result h1 { font-size: clamp(28px, 6vw, 46px); }
        .deck { margin-top: 12px; }
        .cta { margin-top: 20px; }
        .stage.has-result .cta { margin-top: 12px; }
        .dune { height: 20vh; }
        .frame { width: min(78vw, calc(min(44vh, 340px) * 1024 / 1280)); height: auto; }
        .stage.has-result .content { top: 2.4vh; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sky, .sun, .settlement i, .dust i, .aura, .frame.is-loading::before { animation: none; }
        .portrait.is-in, .frame.is-ready { animation: none; }
        .frame.is-ready .sheen::after { animation: none; }
        .frame img, h1, .deck, .sun { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="sky"></div>
      <div class="sun" aria-hidden="true"></div>
      <canvas class="stars"></canvas>
      <div class="vignette"></div>
      <div class="dust" aria-hidden="true">
        <i style="left:12%;bottom:20%;animation-duration:78s"></i>
        <i style="left:28%;bottom:8%;animation-duration:92s;animation-delay:-20s"></i>
        <i style="left:46%;bottom:16%;animation-duration:64s;animation-delay:-8s"></i>
        <i style="left:63%;bottom:6%;animation-duration:86s;animation-delay:-40s"></i>
        <i style="left:81%;bottom:18%;animation-duration:74s;animation-delay:-15s"></i>
        <i style="left:90%;bottom:28%;animation-duration:100s;animation-delay:-50s"></i>
      </div>
      <div class="settlement" aria-hidden="true">
        <i style="left:8%;bottom:10%;animation-delay:-1s"></i>
        <i style="left:16%;bottom:28%;animation-delay:-4s"></i>
        <i style="left:24%;bottom:18%;animation-delay:-2s"></i>
        <i style="left:33%;bottom:40%;width:2px;height:2px;animation-delay:-7s"></i>
        <i style="left:41%;bottom:22%;animation-delay:-3s"></i>
        <i style="left:48%;bottom:48%;animation-delay:-6s"></i>
        <i style="left:54%;bottom:30%;animation-delay:-1.5s"></i>
        <i style="left:61%;bottom:16%;animation-delay:-8s"></i>
        <i style="left:69%;bottom:36%;animation-delay:-5s"></i>
        <i style="left:76%;bottom:20%;animation-delay:-2.4s"></i>
        <i style="left:84%;bottom:42%;width:2px;height:2px;animation-delay:-9s"></i>
        <i style="left:92%;bottom:14%;animation-delay:-3.5s"></i>
      </div>
      <svg class="dune" viewBox="0 0 1440 280" preserveAspectRatio="none" aria-hidden="true">
        <path
          fill="#070604"
          d="M0 118C180 78 280 150 460 112C650 72 760 28 940 70C1100 106 1220 64 1440 96V280H0Z"
        />
      </svg>
      <main class="content">
        <div class="hero">
          <p class="kicker">Thành phố ánh sáng</p>
          <h1><span>Sun Blanca</span><em>City</em></h1>
          <p class="deck">Ngày mới bắt đầu khi mặt trời thức dậy trong lòng thành phố.</p>
        </div>
        <figure class="portrait" id="portrait" hidden aria-live="polite">
          <div class="aura" aria-hidden="true"></div>
          <div class="frame" id="portrait-frame">
            <a id="result-link" target="_blank" rel="noopener noreferrer" aria-label="Mở hình biến hình">
              <img id="result-image" alt="Hình biến hình Sun Blanca City" />
            </a>
            <span class="sheen" aria-hidden="true"></span>
            <span class="corner tl" aria-hidden="true"></span>
            <span class="corner tr" aria-hidden="true"></span>
            <span class="corner bl" aria-hidden="true"></span>
            <span class="corner br" aria-hidden="true"></span>
          </div>
          <figcaption id="portrait-caption">Đã biến hình</figcaption>
        </figure>
        <div class="cta">
          <button id="bien-hinh" type="button" aria-expanded="false">Biến hình</button>
        </div>
      </main>
    </div>
    <script src="../bnb-chat.js"></script>
    <script>
      (function () {
        var canvas = document.querySelector('.stars');
        var ctx = canvas.getContext('2d');
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var stars = [];

        function layout() {
          var dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.max(1, canvas.clientWidth * dpr);
          canvas.height = Math.max(1, canvas.clientHeight * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          var count = Math.min(120, Math.round((canvas.clientWidth * canvas.clientHeight) / 14000));
          stars = [];
          for (var i = 0; i < count; i++) {
            stars.push({
              x: Math.random(),
              y: Math.random() * 0.68,
              r: Math.random() * 1.15 + 0.25,
              p: Math.random() * Math.PI * 2,
              s: 0.2 + Math.random() * 0.45,
              v: 0.004 + Math.random() * 0.008,
            });
          }
        }

        function draw(now) {
          var w = canvas.clientWidth;
          var h = canvas.clientHeight;
          ctx.clearRect(0, 0, w, h);
          for (var i = 0; i < stars.length; i++) {
            var star = stars[i];
            if (!reduce) {
              star.y -= star.v * 0.016;
              if (star.y < -0.02) star.y = 0.68;
            }
            var alpha = reduce ? 0.7 : 0.28 + Math.sin(now * 0.001 * star.s + star.p) * 0.4;
            ctx.fillStyle = 'rgba(255, 244, 220,' + alpha + ')';
            ctx.beginPath();
            ctx.arc(star.x * w, star.y * h, star.r, 0, Math.PI * 2);
            ctx.fill();
          }
          if (!reduce) requestAnimationFrame(draw);
        }

        layout();
        window.addEventListener('resize', layout);
        requestAnimationFrame(draw);

        var button = document.querySelector('#bien-hinh');
        var stage = document.querySelector('.stage');
        var portrait = document.querySelector('#portrait');
        var frame = document.querySelector('#portrait-frame');
        var resultLink = document.querySelector('#result-link');
        var resultImage = document.querySelector('#result-image');
        var caption = document.querySelector('#portrait-caption');
        var shownUrl = '';
        var chat = null;
        var root = null;

        var RESULT_IMAGE_PREFIX = 'https://bnb-chat-agent-media.bienhinh.vn/bienhinh-results';

        function safeImageUrl(value) {
          try {
            var url = new URL(value);
            if (url.protocol !== 'https:' && url.protocol !== 'http:') return '';
            return url.href;
          } catch (error) {
            return '';
          }
        }

        function resultImageFromMessage(message) {
          if (typeof message !== 'string') return '';
          var start = message.indexOf(RESULT_IMAGE_PREFIX);
          if (start < 0) return '';
          var end = start + RESULT_IMAGE_PREFIX.length;
          while (end < message.length && !/[\s)\]"'<>]/.test(message.charAt(end))) end += 1;
          return message.slice(start, end);
        }

        function closeChatIfOpen() {
          if (root && root.dataset.open === 'true' && chat) chat.close();
        }

        function presentResult(imageUrl) {
          var safe = safeImageUrl(imageUrl);
          if (!safe) return;
          closeChatIfOpen();
          if (safe === shownUrl) return;
          shownUrl = safe;
          resultLink.href = safe;
          caption.textContent = 'Đã biến hình';
          stage.classList.add('has-result');
          portrait.hidden = false;
          portrait.classList.remove('is-in');
          void portrait.offsetWidth;
          portrait.classList.add('is-in');
          frame.classList.remove('is-ready');
          frame.classList.add('is-loading');
          resultImage.onload = function () {
            if (resultImage.getAttribute('src') !== safe) return;
            frame.classList.remove('is-loading');
            frame.classList.add('is-ready');
          };
          resultImage.onerror = function () {
            if (resultImage.getAttribute('src') !== safe) return;
            frame.classList.remove('is-loading');
            caption.textContent = 'Không tải được hình';
          };
          resultImage.src = safe;
          button.textContent = 'Biến hình lại';
        }

        if (!window.BnbChat || typeof window.BnbChat.init !== 'function') return;
        chat = window.BnbChat.init({
          publicKey: 'ukBYP38IRldhDqwUhFV5mjYjAzAp2fkX',
          baseUrl: 'https://bnb-chat-agent.bienhinh.vn',
          primaryColor: '#e4b15a',
          position: 'bottom-right',
          onNotification: function (payload) {
            if (!payload) return;
            var imageUrl = resultImageFromMessage(payload.message);
            if (!imageUrl) return;
            presentResult(imageUrl);
          },
        });
        var host = document.querySelector('bnb-chat-host');
        root = host && host.shadowRoot && host.shadowRoot.querySelector('.root');
        function sync() {
          button.setAttribute('aria-expanded', root && root.dataset.open === 'true' ? 'true' : 'false');
        }
        if (root) {
          new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ['data-open'] });
        }
        button.addEventListener('click', function () {
          if (root && root.dataset.open === 'true') chat.close();
          else chat.open();
        });
      })();
    </script>
  </body>
</html>
